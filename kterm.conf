# kterm.conf

# keyboard:  0 - off, 1 - on
keyboard = 1
# color scheme: 0 - light, 1 - dark
color_scheme = 0
# font family
# see fonts/README.md for installing a Nerd Font
font_family = "Monospace"
# font size
font_size = 8
# terminal encoding
#encoding = "UTF-8"
# keyboard config file
#kb_conf_path = "/mnt/us/extensions/kterm/layouts/keyboard.xml"
# screen orientation: U, R or L
#orientation = U
# cursor shape: B, I or U
#cursor_shape = B

# escape sequence shim: 0 - off, 1 - on
# Runs the child shell under ktsh, which removes the sequences vte 0.28
# would print as literal text (fish and zsh shell integration, hyperlinks),
# answers background colour queries so applications stop
# guessing dark mode, and converts vte's legacy mouse reports to the SGR
# form modern applications expect. Turn off to talk to vte directly.
shim = 1

# how the shim folds 24-bit colour, which vte 0.28 cannot render:
#   "256"  - nearest xterm-256 palette entry (default)
#   "gray" - luminance onto the 24 step gray ramp, better on eink
#   "keep" - pass through, expect garbage
#color_folding = "256"

# kitty graphics protocol: 0 - off, 1 - on
# Answers the terminal identity query applications use to decide whether
# images are worth attempting, and renders what they send. Requires the
# shim. Turn off to behave exactly as 2.7.0 did.
graphics = 1

# status bar above the terminal: 0 - off, 1 - on
# Shows the clock, date and battery, and carries a menu button so the popup
# menu is reachable without a two finger tap. Refreshes once a minute and
# only repaints labels whose text actually changed.
statusbar = 1

# mouse reporting: 0 - off, 1 - on
# With this off, taps never reach the application. Useful if something has
# left mouse tracking enabled and every tap sprays escapes at the shell.
mouse_report = 1

# one finger drag scrolls the scrollback buffer: 0 - off, 1 - on
touch_scroll = 1

# how long to hold before a drag becomes a precise drag, ms (100 - 5000)
# A precise drag passes real mouse events to the application, so it can select
# text or drag a pane divider. Lower it if holds feel sluggish, raise it if
# ordinary drags keep turning into selections.
touch_hold_ms = 600

# drag scroll speed, percent (10 - 1000)
# 100 scrolls one row per row of finger travel. 200 is twice as fast.
touch_scroll_speed = 100
