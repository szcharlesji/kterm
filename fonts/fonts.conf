<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  kterm font configuration.

  The Kindle rootfs is read only and its /etc/fonts/fonts.conf only scans
  /usr/share/fonts and ~/.fonts, so a font dropped into the kterm extension
  is invisible to pango unless fontconfig is pointed here instead. The
  launcher does that with FONTCONFIG_FILE.

  Drop any .ttf/.otf into the directory next to this file and it becomes
  available to kterm. See README.md for where to get a patched Nerd Font.
-->
<fontconfig>

  <!-- keep the system fonts (Amazon Ember and friends) available -->
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>

  <!-- fonts shipped with, or added to, this extension -->
  <dir>/mnt/us/extensions/kterm/fonts</dir>

  <!-- KOReader ships Symbols Nerd Font; borrow it when it is installed -->
  <dir>/mnt/us/koreader/fonts</dir>

  <!-- the rootfs is read only, so the cache has to live on writable storage -->
  <cachedir>/var/local/kterm-fontcache</cachedir>
  <cachedir>/mnt/us/extensions/kterm/fonts/.cache</cachedir>

  <!--
    Make the Nerd Font icon ranges reachable from any monospace family.
    Pango falls back per glyph on its own, but naming the symbol font
    explicitly keeps powerline separators from landing in a proportional
    face and breaking the cell grid.
  -->
  <match target="pattern">
    <test name="family"><string>monospace</string></test>
    <edit name="family" mode="append" binding="weak">
      <string>JetBrainsMono Nerd Font Mono</string>
    </edit>
    <edit name="family" mode="append" binding="weak">
      <string>Symbols Nerd Font Mono</string>
    </edit>
    <edit name="family" mode="append" binding="weak">
      <string>NotoSans Nerd Font</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="spacing" compare="eq"><const>mono</const></test>
    <edit name="family" mode="append" binding="weak">
      <string>JetBrainsMono Nerd Font Mono</string>
    </edit>
    <edit name="family" mode="append" binding="weak">
      <string>NotoSans Nerd Font</string>
    </edit>
  </match>

  <!--
    TX-02 (Berkeley Mono) carries no Nerd Font glyphs, so name the icon
    fallback explicitly. Note fontconfig escapes the hyphen in this family
    name: on the command line it is TX\-02, and a bare `fc-match TX-02`
    parses the "-02" as a size and silently matches something else.
  -->
  <match target="pattern">
    <test name="family"><string>TX-02</string></test>
    <edit name="family" mode="append" binding="weak">
      <string>JetBrainsMono Nerd Font Mono</string>
    </edit>
    <edit name="family" mode="append" binding="weak">
      <string>Symbols Nerd Font Mono</string>
    </edit>
    <edit name="family" mode="append" binding="weak">
      <string>NotoSans Nerd Font</string>
    </edit>
  </match>

  <!-- eink is grayscale: subpixel antialiasing only muddies the glyphs -->
  <match target="font">
    <edit name="rgba" mode="assign"><const>none</const></edit>
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintfull</const></edit>
  </match>

</fontconfig>
